name: Deploy oVPNmanager
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy con Docker Compose
        run: |
          set -e
          
          if ! command -v docker &> /dev/null; then
            echo "Docker no está instalado. Instalando..."
            curl -fsSL https://get.docker.com | sh
          fi
          
          if ! docker compose version &> /dev/null; then
            echo "Docker Compose no está instalado. Instalando..."
            curl -fsSL https://get.docker.com | sh
          fi
          
          DEPLOY_DIR="${{ github.workspace }}"
          
          if [ ! -f .env ]; then
            printf '%s\n' \
              "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" \
              "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              "SERVER_PUBLIC_IP=${{ secrets.SERVER_PUBLIC_IP }}" \
              > .env
          fi
          
          docker compose up -d --build
          
          sleep 15
          
          if curl -sk https://localhost:8843/api/auth/session > /dev/null 2>&1; then
            echo "Despliegue exitoso"
          else
            echo "Fallo en healthcheck"
            docker compose logs --tail=100
            exit 1
          fi
